scripture_reference: Isaiah 40:29
scripture_text: >-
  He gives strength to the weary, And to the one who lacks might He increases
  power.
scripture_translation: NASB 2020
scripture_verified: true
scripture_verification_notes: >-
  NASB 2020 text retrieved from Bible Gateway (version=NASB) on 2026-08-05.

gentle_word: |
  There is a tiredness that sleep does not fix. You have slept — maybe not
  well, but you have slept — and you wake up just as worn. It lives somewhere
  deeper than your body, and no one around you can quite see it. It is real,
  and it counts.

  Read this verse slowly. He gives power to the weak. Not to the ones who
  rallied. Not to the ones who managed to push through one more time. To the
  weak — to the one who has no might left. Your emptiness is not a
  disqualification here. It is the exact condition this promise is written for.

  You do not have to manufacture strength today. You only have to stay near
  the One who gives it, and let Him decide what you actually need to carry
  before bedtime. It is probably less than you think.
prayer: |
  God, I am tired in a place sleep does not reach. I have nothing to offer You
  today except the emptiness itself — so I am bringing You that. You say You
  give power to the weak. I am the weak. Give what I cannot make, carry what I
  cannot lift, and let me stop pretending I am fine. Amen.
journal_question: >-
  Where does the tiredness actually live today — your body, your mind, your
  heart? Name it honestly, without minimizing it.
small_step: >-
  Cross one thing off today's list without doing it — not moved, crossed off.
  Let the strength you save be God's gift for what remains.
carry_phrase: Weak is not disqualified. Weak is who the promise is for.

