gentle_word: |
  There is a particular ache in praying the same prayer again. You have said
  the words so many times they feel worn smooth, and part of you wonders
  whether they are landing anywhere at all. Asking that question does not
  make you unfaithful. It makes you honest.

  Hold this one verse: I waited patiently for Yahweh. He turned to me, and
  heard my cry. It was written by someone on the other side of a long wait —
  proof that the silence he prayed through was never absence. God was
  listening the whole time. The turning came, even though it came slowly.

  Your repeated prayer is not nagging, and it is not being filed away unread.
  Every time you pray it, you are heard — the same way the first time was
  heard. You do not have to make the words new today. You only have to bring
  them again.
prayer: |
  God, You know the prayer I mean before I say it — I have brought it to You
  so many times. Today I bring it again, not because I doubt You heard me, but
  because You invite me to keep coming. Help me wait patiently the way the
  psalmist did, trusting that You are listening now and that Your turning is
  on its way. Amen.
journal_question: >-
  What is the prayer you have prayed the longest? Write down the date you
  started praying it, if you can remember — and let the length be evidence of
  faithfulness, not failure.
small_step: >-
  Pray the worn prayer one more time today, in the plainest words you have.
  Then say: "You heard that." Because He did.
carry_phrase: Prayed again is not unheard. He hears every time.

