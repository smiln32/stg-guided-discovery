gentle_word: |
  Distance you can feel does not always mean distance that is real. There are
  seasons when God feels far — when prayers seem to hit the ceiling and the
  familiar warmth is gone. That ache is not a verdict on your faith.

  (Draft encouragement — pending content review.)
prayer: |
  God, You feel far away, and I miss You. Even now, I am turning toward You.
  Would You close the distance I cannot close myself? Amen.
