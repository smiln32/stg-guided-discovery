scripture_reference: Philippians 4:6-7
scripture_text: >-
  Do not be anxious about anything, but in everything by prayer and pleading
  with thanksgiving let your requests be made known to God. And the peace of
  God, which surpasses all comprehension, will guard your hearts and minds in
  Christ Jesus.
scripture_translation: NASB 2020
scripture_verified: true
scripture_verification_notes: >-
  NASB 2020 text retrieved from Bible Gateway (version=NASB) on 2026-08-05.

gentle_word: |
  Some worries do not leave when you tell them to. They circle back — in the
  quiet of the kitchen, in the dark before sleep — and telling yourself to stop
  worrying has never once worked. You are not failing because your mind is loud
  today.

  Notice what this verse actually asks of you. Not "feel calm." Not "fix it."
  Only this: bring the thing to God. Say what you need, plainly, with whatever
  thanksgiving you can honestly find. The worry does not have to be gone before
  you pray. The prayer is what you do with the worry.

  And the peace that comes is not something you produce. It is something that
  guards you — quietly, like a keeper at a gate — even while the questions are
  still open. Hand over one worry, just for today. That is enough.
prayer: |
  God, my mind is loud today, and I cannot make it quiet on my own. So instead
  of carrying this worry in circles, I am handing it to You — plainly, the way
  Your word invites me to. Thank You that Your peace does not wait for my
  feelings to settle first. Guard my heart and my thoughts tonight, because I
  cannot guard them myself. Amen.
journal_question: >-
  What is the one worry that keeps circling back? Write it in a single sentence,
  as plainly as you can.
small_step: >-
  Take the worry you just named and say it to God out loud, in one sentence.
  You do not have to solve it — only hand it over.
carry_phrase: You do not have to carry this in circles. Hand it over.

