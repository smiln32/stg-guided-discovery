gentle_word: |
  Waiting was easier at the beginning, when it still felt temporary. But you
  are further in now, and the waiting has become a place you live. It costs
  something to keep hoping this long. You are not weak for feeling that cost.

  Notice the quiet order of this promise. Wings first — but then running, and
  then, last of all, walking. As if God knows that most of a long wait is not
  soaring at all. It is walking. Ordinary days, one after another, that ask
  you simply not to faint. And for that, too — especially for that — He
  promises strength.

  The waiting is not wasted, and it is not unwatched. The same God you are
  waiting for is the One holding you up while you wait. Today does not need
  wings. It only needs the next walking step, and He has strength for that.
prayer: |
  God, this wait has gone on longer than I thought I could bear, and some days
  my hope feels tired. You promise that those who wait for You will renew
  their strength — so I am staying here, waiting for You, even today. I do not
  need to soar. Just keep me walking without fainting, one ordinary day at a
  time. Amen.
journal_question: >-
  What has this waiting season quietly cost you? Tell God about that cost — He
  does not need you to pretend it is easy.
small_step: >-
  Do one ordinary next thing today — not to speed up the answer, just to keep
  walking. Fold the laundry. Send the email. Let it count as faithfulness.
carry_phrase: Today does not need wings. Only the next walking step.

