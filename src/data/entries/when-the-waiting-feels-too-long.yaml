scripture_reference: Psalm 27:14
scripture_text: >-
  Wait for the LORD; Be strong and let your heart take courage; Yes, wait for
  the LORD.
scripture_translation: NASB 2020
scripture_verified: true
scripture_verification_notes: >-
  NASB 2020 text retrieved from Bible Gateway (version=NASB) on 2026-08-05.

gentle_word: |
  Waiting is its own kind of hard. Not the sharp pain of a crisis, but the slow
  ache of the in-between — the answer that has not come, the door that has not
  opened, the ordinary days that keep passing while you wait.

  Notice that the psalm says it twice: wait for the Lord... wait for the Lord.
  As if the writer knew you would need to hear it again. Waiting is not wasted
  time, and it is not proof you have been forgotten. It is where courage is
  quietly built.

  You do not have to wait perfectly. You only have to keep your heart turned,
  one more day, toward the One who has not forgotten you.
prayer: |
  Lord, the waiting is long, and I am tired of holding my breath. Would You give
  my heart courage for one more day? Help me trust that this in-between is not
  empty, and that You have not forgotten me. I will keep waiting for You. Amen.
journal_question: >-
  What would "taking courage" look like today — not for the whole wait, just for
  this one day?
small_step: >-
  Do one small, ordinary, good thing while you wait — water a plant, take a walk,
  send a kind note. Living gently is a way of waiting well.
carry_phrase: Wait for the Lord. He has not forgotten you.

