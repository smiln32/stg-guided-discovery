gentle_word: |
  Your mind is trying to keep you safe. That is what all the rehearsing is —
  running ahead to tomorrow to see if you can survive it before it arrives. It
  is tiring work, and you were never asked to do it.

  Notice what Jesus does not say here. He does not say tomorrow will be easy, or
  that your worries are foolish. He simply says tomorrow can carry its own
  weight. You do not have to pick it up today.

  For right now, there is only this hour, and grace enough for this hour. You
  can set the rest down. It will still be there if it needs you, and He will be
  there with it.
prayer: |
  Father, my thoughts keep sprinting toward a tomorrow I cannot see. Slow me
  down to today. Let me trust that You are already there in whatever comes, and
  that You will meet me when I arrive. For now, help me breathe, and rest in the
  grace of this one day. Amen.
journal_question: >-
  What is one worry about tomorrow that you could gently set down until it
  actually arrives?
small_step: >-
  Name one thing that is true and steady right now — the chair holding you, the
  breath you just took — and let it be enough for this minute.
carry_phrase: Today has enough grace for today.

pin_quote: >-
