gentle_word: |
  Some days the list is simply longer than the day. You can feel it before your
  feet touch the floor — everything that is expected of you, stacked and
  waiting. And somewhere underneath the doing, a quieter worry: if I stop, it
  all falls.

  Look at what the Shepherd does in this psalm. He makes me lie down. He leads
  me beside still waters. The resting is not something the sheep earns after the
  work is finished. It is something the Shepherd insists on, because He knows
  what the sheep needs better than the sheep does.

  You will not get to the end of the list today. That was never the condition
  for being cared for. You are allowed to be led somewhere quiet for a few
  minutes, right in the middle of the undone things.
prayer: |
  God, the list is longer than the day again, and I feel it pressing on me. I
  cannot do everything, and I am tired of pretending I can. Shepherd me today.
  Make me lie down when I will not choose it myself. Lead me beside something
  still, even for a moment, and restore what the hurry has worn thin. Amen.
journal_question: >-
  If a good shepherd looked at your day, what is the one thing he would gently
  take off the list?
small_step: >-
  Choose one thing on today's list and move it to tomorrow — on purpose, without
  apologizing for it. Let that be the still water for today.
carry_phrase: The Shepherd sets the pace. Not the list.

