gentle_word: |
  You are the one people lean on. The one who shows up with the meal, sits
  with the crying friend, holds the family steady. And somewhere along the
  way, a quiet assumption formed: comfort is something you give, not
  something you get.

  But look at the order in this passage. Before you are ever asked to comfort
  anyone, you are comforted — by the Father of mercies, the God of all
  comfort, in all your affliction. Yours included. The sorrows you have set
  aside to tend to everyone else's are not invisible to Him.

  The comfort you give was never meant to be produced from your own reserves.
  It was meant to be passed along — received first, then given. So today,
  before you pour out again, let yourself be on the receiving end for a
  moment. Even the comforter gets comforted. Especially the comforter.
prayer: |
  Father of mercies, I have been the strong one for a long time, and I have
  quietly stopped expecting comfort for myself. But Your word says You comfort
  us in all our affliction — mine too. So today I stop pouring for a moment
  and hold out my own hands. Comfort me first, and then let what You give me
  overflow to the ones I care for. Amen.
journal_question: >-
  What sorrow of your own have you set aside to tend to everyone else's? Name
  it — it is not invisible to God.
small_step: >-
  Before you care for anyone else today, sit for two quiet minutes and let God
  care for you first. Received first, then given — that is the order.
