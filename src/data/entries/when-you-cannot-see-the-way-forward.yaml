scripture_reference: Proverbs 3:5-6
scripture_text: >-
  Trust in Yahweh with all your heart, and don't lean on your own
  understanding. In all your ways acknowledge him, and he will make your paths
  straight.
scripture_translation: WEB (World English Bible, public domain)
scripture_verified: true
scripture_verification_notes: >-
  Public-domain WEB text verified against bible-api.com (WEB) for
  demonstration. WEB renders the divine name as "Yahweh." Replace with
  verified NASB 2020 for production.

gentle_word: |
  You have been trying to see around the corner, and you cannot. Every option
  has an "unless," every plan a question mark you cannot resolve. When
  understanding runs out, it can feel like faith has failed. It has not. This
  is simply where trust begins.

  Notice that this verse does not promise you the map. It promises the path —
  made straight not by your figuring, but by His faithfulness, one
  acknowledged step at a time. You do not have to lean your whole weight on
  what you can work out. There is somewhere sturdier to lean.

  Today, you are not asked to choose the whole future. You are asked to bring
  God into the step in front of you — the phone call, the conversation, the
  waiting — and let the rest stay unresolved a little longer, held by Someone
  who already sees the road.
prayer: |
  God, I cannot see the way forward, and I am tired of trying to figure it out
  from here. I bring You the step in front of me — just that one. I choose to
  lean on You instead of on my own understanding, even though it feels
  unfamiliar. Make the path straight in Your time, and steady me while I wait
  to see it. Amen.
journal_question: >-
  What is the one step that is actually in front of you today — not the whole
  road, just the next step?
small_step: >-
  Before you make any move on the thing you cannot resolve, say: "God, come
  into this step with me." Then take only that step.
carry_phrase: You are not asked to see the road. Only the step.

