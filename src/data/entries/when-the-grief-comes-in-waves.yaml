gentle_word: |
  Grief does not move in a straight line. It comes in waves — a song, a smell, an
  ordinary Tuesday — and suddenly you are underwater again. This is not you doing
  it wrong. This is love with nowhere to go.

  Notice where God is in this verse. Not far off, waiting for you to feel better.
  Near. Especially near to the broken-hearted, close to the crushed in spirit.
  Your sorrow does not push Him away; it draws Him close.

  You do not have to hurry through this. He is not hurrying you. He simply stays,
  near, for as long as the waves keep coming.
prayer: |
  Lord, the missing is so heavy today. I did not choose this, and I cannot fix
  it. Would You come near, the way You promise to — near to the broken-hearted?
  I do not need You to hurry my grief. I only need You to stay. Amen.
journal_question: >-
  If your grief could speak one honest sentence to God right now, what would it
  say?
small_step: >-
  Let one wave come without judging yourself for it. You might set a hand on
  your heart and simply say, "He is near," and breathe.
carry_phrase: He is near to the broken-hearted.

