gentle_word: |
  Maybe you have sat down to pray and found nothing there. Just tiredness, or a
  tangle of feelings too big for sentences. If that is you, this verse is a
  kindness meant for exactly this moment.

  You are not required to pray well. You are not even required to have words. The
  Spirit Himself carries what you cannot put into language — the groans, the
  sighs, the ache underneath the ache. When you do not know how to pray, you are
  not praying alone.

  A held-out hand is a prayer. A tired sigh is a prayer. Simply turning toward
  God with nothing to say is a prayer, and it is heard.
prayer: |
  Holy Spirit, I do not have the words today. Would You carry what I cannot say?
  Take these sighs and this weariness and turn them into the prayer I do not
  know how to pray. I am here, and I am turning toward You. That will have to be
  enough — and I trust that it is. Amen.
journal_question: >-
  If you could pray one wordless thing right now — just a feeling handed to God —
  what would it be?
small_step: >-
  Sit quietly for one minute with your hands open in your lap. Let that be the
  whole prayer. You do not need to fill the silence.
carry_phrase: When you don't know how to pray, you are not praying alone.

