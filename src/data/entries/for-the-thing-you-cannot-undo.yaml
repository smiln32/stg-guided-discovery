scripture_reference: Lamentations 3:22-23
scripture_text: >-
  The LORD's acts of mercy indeed do not end, For His compassions do not fail.
  They are new every morning; Great is Your faithfulness.
scripture_translation: NASB 2020
scripture_verified: true
scripture_verification_notes: >-
  NASB 2020 text retrieved from Bible Gateway (version=NASB) on 2026-08-05.

gentle_word: |
  There is a particular ache in regret — the going back, again and again, to a
  moment you would give almost anything to change. You cannot undo it. That is
  the hard, true thing. And no amount of replaying it will rewrite it.

  But hear what is also true. His mercies are new every morning — not most
  mornings, not the mornings you have earned. Every one. The grace that meets
  you today is not yesterday's leftovers. It is fresh, and it is enough, and it
  is for you.

  You are not the sum of your worst moment. You are held by a faithfulness that
  does not fail, even when you have.
prayer: |
  Father, I keep carrying this. I cannot change what happened, and I am so tired
  of the weight of it. Thank You that Your mercy is new this morning — new enough
  for even this. Help me receive the grace I keep refusing myself. Amen.
journal_question: >-
  What would it look like to accept, just for today, that God's mercy this
  morning is enough to cover the thing you cannot undo?
small_step: >-
  Say one honest sentence to God about the regret, out loud if you can. Then let
  the morning's mercy be the last word instead of the regret.
carry_phrase: His mercies are new this morning — new enough for this.

