# Netlify configuration for stg-guided-discovery.
#
# This builds the feature module as a STANDALONE site — useful for previews and
# review while the decision of how it attaches to simplifytoglorify.com is still
# open (see the README). If the module ends up proxied at /daily/ on the main
# domain, or folded into the main repo, this file's role changes or ends.
#
# Fully static (Astro output: 'static') — no functions, no runtime.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set SITE_URL in the Netlify UI, not here. See .env.example.

# Security headers (calm defaults; adjust CSP if you add third-party scripts).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Long-cache fingerprinted assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: uncomment to 301 the bare root to the feature if this is a
# standalone deploy and you removed src/pages/index.astro.
# [[redirects]]
#   from = "/"
#   to = "/daily/"
#   status = 301
