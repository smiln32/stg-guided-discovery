# Netlify configuration for stg-website-interactives.
# The site is fully static (Astro output: 'static') — no functions, no runtime.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set SITE_URL in the Netlify UI, not here. See .env.example.

# Security headers (calm defaults; adjust CSP if you add third-party scripts).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Long-cache fingerprinted assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: uncomment to 301 the bare root to the feature if this is a
# standalone deploy and you removed src/pages/index.astro.
# [[redirects]]
#   from = "/"
#   to = "/daily/"
#   status = 301
