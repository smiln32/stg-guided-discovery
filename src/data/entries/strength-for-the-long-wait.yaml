scripture_reference: Isaiah 40:31
scripture_text: >-
  But those who wait for Yahweh will renew their strength. They will mount up
  with wings like eagles. They will run, and not be weary. They will walk, and
  not faint.
scripture_translation: WEB (World English Bible, public domain)
