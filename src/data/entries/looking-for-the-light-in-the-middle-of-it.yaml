scripture_translation: NASB 2020
scripture_verified: true
scripture_verification_notes: >-
  NASB 2020 text retrieved from Bible Gateway (version=NASB) on 2026-08-05.

gentle_word: |
  Gratitude does not mean ignoring the hard parts of your day. It simply means looking for the light right in the middle of them. Sometimes, the biggest comfort comes from the smallest moments—a quiet cup of coffee, the warmth of the sun, or a single deep breath.

  When we are asked to give thanks in all things, it is not a demand to pretend everything is perfect. It is a gentle invitation to remember that God is present with you, right now, in the exact season you are in.

  You do not have to find a grand reason to be thankful today. You can just notice one small, ordinary grace.
prayer: |
  God, some days it is hard to see past the noise. Help me to pause and notice the small ways You are caring for me today. Give me eyes to see the quiet graces, and a heart that can rest in Your goodness. Amen.
journal_question: >-
  What is one small, ordinary thing you can see or feel right now that brings you a quiet sense of peace?
small_step: >-
  Write down or say out loud one simple thing you are grateful for today. Let it be as small as a warm blanket or a quiet moment.
carry_phrase: There is grace in the small things.

