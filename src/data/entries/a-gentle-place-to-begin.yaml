gentle_word: |
  Welcome. Whatever brought you here — Pinterest, a search, a hard morning — you
  do not have to arrive with anything figured out. You can simply be still for a
  moment. That is a good enough place to begin.

  "Be still, and know that I am God." Notice the order. You do not have to
  understand everything, or feel a certain way, or solve the thing pressing on
  you today. You are invited first to be still, and to let God be God — steady,
  present, and unhurried with you.

  Here you will find one Scripture, one gentle word, one prayer, and one small
  step at a time. Never more than you can hold. Take just today.
prayer: |
  God, here I am. I do not have it all together, and I am learning that I do not
  have to. Help me be still long enough to remember that You are God and I am
  held. Meet me right here, in this ordinary moment, and let it be a gentle place
  to begin again. Amen.
journal_question: >-
  What is one thing you can gently set down, just for the length of this page?
small_step: >-
  Take one slow breath before you go. That is enough. You can come back tomorrow
  for the next small thing.
carry_phrase: Be still. You are held.

