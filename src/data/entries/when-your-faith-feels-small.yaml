gentle_word: |
  This prayer was prayed by a desperate father, through tears, to Jesus's
  face: I believe. Help my unbelief. Both things at once — the believing and
  the doubting, in the same breath, in the same heart. And Jesus did not send
  him away to come back when his faith was tidier. He healed the man's son.

  Maybe your faith feels small today. Worn thin by the year you have had, or
  quieter than it used to be, or tangled up with questions you are almost
  afraid to say out loud. Take heart: the size of your faith was never the
  point. The One you bring it to is.

  A small faith in a great God is still faith. You are allowed to come as the
  father came — honest, in tears if it is that kind of day, holding belief and
  unbelief in the same two hands. He receives that. He always has.
prayer: |
  Lord, I believe. Help my unbelief. That is the most honest prayer I have
  today, so I am praying it just as it is. Thank You that You did not turn the
  doubting father away, and that You will not turn me away either. Meet my
  small faith with Your great faithfulness. Amen.
journal_question: >-
  What is the honest version of your faith today — the believing part and the
  doubting part? Write both without editing either one.
small_step: >-
  Pray the father's prayer once, word for word: "I believe. Help my unbelief."
  That is a complete prayer. Nothing needs to be added.
carry_phrase: A small faith in a great God is still faith.

