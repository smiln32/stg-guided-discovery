scripture_reference: Matthew 11:28
scripture_text: >-
  Come to Me, all who are weary and burdened, and I will give you rest.
scripture_translation: NASB 2020
scripture_verified: true
scripture_verification_notes: >-
  NASB 2020 text retrieved from Bible Gateway (version=NASB) on 2026-08-05.

gentle_word: |
  You have been carrying so much, and most of it quietly. The appointments, the
  worry that never fully sleeps, the thousand small tasks no one sees. You are
  tired in a way that rest does not always reach.

  Notice who this invitation is for. Not the rested and capable — the ones who
  labor and are heavily burdened. That is you. You do not have to earn this rest
  by carrying more first. You come as you are, empty-handed and weary, and He
  meets you there.

  You are allowed to be tired. You are allowed to need care too.
prayer: |
  Jesus, I am so tired. I have been strong for a long time, and I am running
  low. I bring You these heavy hands and this weary heart. Would You carry what
  I cannot today? Give me rest that reaches all the way down. Amen.
journal_question: >-
  Where in your body or heart are you most tired right now — and what would it
  mean to bring just that part to God?
small_step: >-
  Ask one small thing of one person today, or let one task wait. Receiving help
  is not failing; it is being human.
carry_phrase: You are allowed to need care too.

