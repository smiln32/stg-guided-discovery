scripture_reference: 2 Corinthians 1:3-4
scripture_text: >-
  Blessed be the God and Father of our Lord Jesus Christ, the Father of
  mercies and God of all comfort; who comforts us in all our affliction, that
  we may be able to comfort those who are in any affliction, through the
  comfort with which we ourselves are comforted by God.
